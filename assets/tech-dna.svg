<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0B1020"/>
    <stop offset="50%" stop-color="#111827"/>
    <stop offset="100%" stop-color="#05070D"/>
  </linearGradient>

  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00F7FF"/>
    <stop offset="100%" stop-color="#7B2FF7"/>
  </linearGradient>

  <filter id="shadow">
    <feDropShadow
      dx="0"
      dy="8"
      stdDeviation="12"
      flood-opacity="0.45"
    />
  </filter>

  <filter id="neon">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect width="1100" height="650" rx="30" fill="url(#bg)" filter="url(#shadow)"/>
<rect x="2" y="2" width="1096" height="646" rx="30" fill="none" stroke="url(#glow)" stroke-width="2" opacity="0.6"/>

<text x="60" y="75"
      fill="#FFFFFF"
      font-family="Arial, Helvetica, sans-serif"
      font-size="32"
      font-weight="700">
