name: Digital Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  generate-digital-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate Digital Hunter
        env:
          GH_TOKEN: ${{ secrets.TECH_DNA_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          import requests

          USERNAME = "Sahilllz"
          OUTPUT = "assets/digital-hunter.svg"

          token = os.environ.get("GH_TOKEN")

          if not token:
              raise RuntimeError("TECH_DNA_TOKEN secret was not found.")

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          response = requests.post(
              "https://api.github.com/graphql",
              json={
                  "query": query,
                  "variables": {"login": USERNAME}
              },
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              },
              timeout=30
          )

          response.raise_for_status()

          data = response.json()

          if "errors" in data:
              raise RuntimeError(
                  "GitHub GraphQL error: " + str(data["errors"])
              )

          user = data.get("data", {}).get("user")

          if not user:
              raise RuntimeError(
                  f"GitHub user '{USERNAME}' was not found."
              )

          calendar = (
              user["contributionsCollection"]
              ["contributionCalendar"]
          )

          total = calendar["totalContributions"]
          weeks = calendar["weeks"]

          days = []

          for week_index, week in enumerate(weeks):
              for day in week["contributionDays"]:

                  parsed = datetime.strptime(
                      day["date"],
                      "%Y-%m-%d"
                  )

                  days.append({
                      "date": day["date"],
                      "count": day["contributionCount"],
                      "week": week_index,
                      "row": (parsed.weekday() + 1) % 7
                  })

          if not days:
              raise RuntimeError(
                  "No contribution data was returned."
              )

          # =================================================
          # CONTRIBUTION STATS
          # =================================================

          maximum = max(day["count"] for day in days)

          active_days = sum(
              day["count"] > 0
              for day in days
          )

          current_streak = 0

          for day in reversed(days):
              if day["count"] > 0:
                  current_streak += 1
              else:
                  break

          longest_streak = 0
          running = 0

          for day in days:
              if day["count"] > 0:
                  running += 1
                  longest_streak = max(
                      longest_streak,
                      running
                  )
              else:
                  running = 0

          strongest = max(
              days,
              key=lambda d: (d["count"], d["date"])
          )

          # =================================================
          # SVG DIMENSIONS
          # =================================================

          width = 1100
          height = 410

          left = 60
          top = 105

          cell = 15
          gap = 4
          step = cell + gap

          # 53 weeks × 7 days
          matrix_width = 53 * step

          # =================================================
          # CONTRIBUTION MATRIX
          # =================================================

          colors = [
              "#07111F",
              "#0D3158",
              "#145A9C",
              "#168BE0",
              "#00D9FF"
          ]

          cells = []

          for day in days:

              count = day["count"]

              x = left + day["week"] * step
              y = top + day["row"] * step

              if maximum == 0:
                  level = 0

              else:
                  ratio = count / maximum

                  if count == 0:
                      level = 0
                  elif ratio <= 0.25:
                      level = 1
                  elif ratio <= 0.50:
                      level = 2
                  elif ratio <= 0.75:
                      level = 3
                  else:
                      level = 4

              cells.append(
                  f"""
                  <rect
                    x="{x}"
                    y="{y}"
                    width="{cell}"
                    height="{cell}"
                    rx="3"
                    fill="{colors[level]}"
                  >
                    <title>
                      {day['date']}: {count} contributions
                    </title>
                  </rect>
                  """
              )

          # =================================================
          # HUNTER TARGET
          # =================================================

          hunter_x = (
              left
              + strongest["week"] * step
              + cell / 2
          )

          hunter_y = (
              top
              + strongest["row"] * step
              + cell / 2
          )

          target_count = strongest["count"]
          target_date = strongest["date"]

          # =================================================
          # TARGET LABEL POSITION
          # =================================================

          label_x = hunter_x + 35

          if label_x > 860:
              label_x = hunter_x - 225

          label_y = hunter_y - 24

          if label_y < 92:
              label_y = hunter_y + 35

          updated = datetime.now(
              timezone.utc
          ).strftime("%Y-%m-%d")

          # =================================================
          # SVG
          # =================================================

          svg = f"""<?xml version="1.0" encoding="UTF-8"?>

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 {width} {height}"
            width="100%"
            role="img"
          >

            <title>
              Sahil Singone Digital Hunter
            </title>

            <desc>
              GitHub contribution visualization generated
              from real contribution data.
            </desc>

            <defs>

              <linearGradient
                id="background"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%"
              >
                <stop
                  offset="0%"
                  stop-color="#030712"
                />

                <stop
                  offset="50%"
                  stop-color="#071525"
                />

                <stop
                  offset="100%"
                  stop-color="#0B1020"
                />
              </linearGradient>

              <linearGradient
                id="border"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="0%"
              >
                <stop
                  offset="0%"
                  stop-color="#00D9FF"
                />

                <stop
                  offset="50%"
                  stop-color="#168BE0"
                />

                <stop
                  offset="100%"
                  stop-color="#7B2FF7"
                />
              </linearGradient>

              <linearGradient
                id="hunterGradient"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%"
              >
                <stop
                  offset="0%"
                  stop-color="#00D9FF"
                />

                <stop
                  offset="100%"
                  stop-color="#7B2FF7"
                />
              </linearGradient>

              <filter
                id="glow"
                x="-200%"
                y="-200%"
                width="500%"
                height="500%"
              >
                <feGaussianBlur
                  stdDeviation="4"
                  result="blur"
                />

                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

            </defs>

            <!-- ========================================= -->
            <!-- BACKGROUND -->
            <!-- ========================================= -->

            <rect
              width="{width}"
              height="{height}"
              rx="24"
              fill="url(#background)"
            />

            <!-- ========================================= -->
            <!-- BORDER -->
            <!-- ========================================= -->

            <rect
              x="2"
              y="2"
              width="{width - 4}"
              height="{height - 4}"
              rx="22"
              fill="none"
              stroke="url(#border)"
              stroke-width="2"
            />

            <!-- ========================================= -->
            <!-- HEADER -->
            <!-- ========================================= -->

            <text
              x="52"
              y="43"
              fill="#FFFFFF"
              font-family="monospace"
              font-size="25"
              font-weight="700"
              letter-spacing="1.2"
            >
              DIGITAL HUNTER
            </text>

            <text
              x="52"
              y="65"
              fill="#7189A8"
              font-family="monospace"
              font-size="11"
              letter-spacing="1"
            >
              CONTRIBUTION ACTIVITY / {USERNAME}
            </text>

            <!-- Status -->

            <circle
              cx="960"
              cy="36"
              r="5"
              fill="#00E676"
              filter="url(#glow)"
            />

            <text
              x="975"
              y="40"
              fill="#00E676"
              font-family="monospace"
              font-size="10"
              font-weight="700"
            >
              ONLINE
            </text>

            <!-- ========================================= -->
            <!-- MATRIX LABEL -->
            <!-- ========================================= -->

            <text
              x="52"
              y="88"
              fill="#00D9FF"
              font-family="monospace"
              font-size="10"
              font-weight="700"
              letter-spacing="1.2"
            >
              CONTRIBUTION MATRIX
            </text>

            <!-- ========================================= -->
            <!-- CONTRIBUTION CELLS -->
            <!-- ========================================= -->

            {''.join(cells)}

            <!-- ========================================= -->
            <!-- HUNTER TRAIL -->
            <!-- ========================================= -->

            <line
              x1="{hunter_x:.2f}"
              y1="{hunter_y:.2f}"
              x2="{label_x:.2f}"
              y2="{label_y:.2f}"
              stroke="#00D9FF"
              stroke-width="1"
              stroke-dasharray="3 6"
              opacity="0.55"
            />

            <!-- ========================================= -->
            <!-- DIGITAL HUNTER -->
            <!-- ========================================= -->

            <g
              transform="translate({hunter_x:.2f},{hunter_y:.2f})"
              filter="url(#glow)"
            >

              <!-- Outer scan -->

              <circle
                cx="0"
                cy="0"
                r="20"
                fill="none"
                stroke="#00D9FF"
                stroke-width="1.5"
                opacity="0.7"
              >

                <animate
                  attributeName="r"
                  values="18;30;18"
                  dur="2.5s"
                  repeatCount="indefinite"
                />

                <animate
                  attributeName="opacity"
                  values="0.7;0.05;0.7"
                  dur="2.5s"
                  repeatCount="indefinite"
                />

              </circle>

              <!-- Inner ring -->

              <circle
                cx="0"
                cy="0"
                r="12"
                fill="none"
                stroke="#7B2FF7"
                stroke-width="1.5"
              >

                <animate
                  attributeName="r"
                  values="10;15;10"
                  dur="1.8s"
                  repeatCount="indefinite"
                />

              </circle>

              <!-- Main hunter -->

              <polygon
                points="0,-13 13,0 0,13 -13,0"
                fill="url(#hunterGradient)"
                stroke="#FFFFFF"
                stroke-width="1"
              />

              <!-- Core -->

              <circle
                cx="0"
                cy="0"
                r="4"
                fill="#FFFFFF"
              >

                <animate
                  attributeName="opacity"
                  values="1;0.25;1"
                  dur="1s"
                  repeatCount="indefinite"
                />

              </circle>

              <!-- Scan lines -->

              <line
                x1="-38"
                y1="0"
                x2="-17"
                y2="0"
                stroke="#00D9FF"
                stroke-width="2"
              />

              <line
                x1="17"
                y1="0"
                x2="38"
                y2="0"
                stroke="#00D9FF"
                stroke-width="2"
              />

              <line
                x1="0"
                y1="-38"
                x2="0"
                y2="-17"
                stroke="#00D9FF"
                stroke-width="2"
              />

              <line
                x1="0"
                y1="17"
                x2="0"
                y2="38"
                stroke="#00D9FF"
                stroke-width="2"
              />

            </g>

            <!-- ========================================= -->
            <!-- TARGET LABEL -->
            <!-- ========================================= -->

            <rect
              x="{label_x - 10:.2f}"
              y="{label_y - 18:.2f}"
              width="200"
              height="40"
              rx="8"
              fill="#071321"
              stroke="#1C4264"
              stroke-width="1"
            />

            <text
              x="{label_x:.2f}"
              y="{label_y - 2:.2f}"
              fill="#00D9FF"
              font-family="monospace"
              font-size="10"
              font-weight="700"
            >
              PEAK / {target_count} CONTRIBUTIONS
            </text>

            <text
              x="{label_x:.2f}"
              y="{label_y + 13:.2f}"
              fill="#7189A8"
              font-family="monospace"
              font-size="9"
            >
              {target_date}
            </text>

            <!-- ========================================= -->
            <!-- STATISTICS -->
            <!-- ========================================= -->

            <line
              x1="52"
              y1="265"
              x2="1048"
              y2="265"
              stroke="#1B3049"
              stroke-width="1"
            />

            <!-- Total -->

            <text
              x="52"
              y="292"
              fill="#5D7696"
              font-family="monospace"
              font-size="9"
              letter-spacing="0.7"
            >
              TOTAL CONTRIBUTIONS
            </text>

            <text
              x="52"
              y="319"
              fill="#00D9FF"
              font-family="monospace"
              font-size="23"
              font-weight="700"
            >
              {total}
            </text>

            <!-- Active -->

            <text
              x="310"
              y="292"
              fill="#5D7696"
              font-family="monospace"
              font-size="9"
              letter-spacing="0.7"
            >
              ACTIVE DAYS
            </text>

            <text
              x="310"
              y="319"
              fill="#00D9FF"
              font-family="monospace"
              font-size="23"
              font-weight="700"
            >
              {active_days}
            </text>

            <!-- Current -->

            <text
              x="565"
              y="292"
              fill="#5D7696"
              font-family="monospace"
              font-size="9"
              letter-spacing="0.7"
            >
              CURRENT STREAK
            </text>

            <text
              x="565"
              y="319"
              fill="#7B2FF7"
              font-family="monospace"
              font-size="23"
              font-weight="700"
            >
              {current_streak}
            </text>

            <!-- Longest -->

            <text
              x="820"
              y="292"
              fill="#5D7696"
              font-family="monospace"
              font-size="9"
              letter-spacing="0.7"
            >
              LONGEST STREAK
            </text>

            <text
              x="820"
              y="319"
              fill="#7B2FF7"
              font-family="monospace"
              font-size="23"
              font-weight="700"
            >
              {longest_streak}
            </text>

            <!-- ========================================= -->
            <!-- FOOTER -->
            <!-- ========================================= -->

            <text
              x="52"
              y="365"
              fill="#3E5876"
              font-family="monospace"
              font-size="9"
            >
              REAL GITHUB CONTRIBUTION DATA • AUTO UPDATED
            </text>

            <text
              x="1048"
              y="365"
              text-anchor="end"
              fill="#3E5876"
              font-family="monospace"
              font-size="9"
            >
              {updated}
            </text>

          </svg>
          """

          os.makedirs(
              os.path.dirname(OUTPUT),
              exist_ok=True
          )

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)

          print("Digital Hunter generated successfully.")
          print(f"Total contributions: {total}")
          print(f"Active days: {active_days}")
          print(f"Current streak: {current_streak}")
          print(f"Longest streak: {longest_streak}")
          print(
              f"Peak target: {target_date} "
              f"({target_count})"
          )

          PY

      - name: Commit Digital Hunter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/digital-hunter.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update Digital Hunter"
          git push
