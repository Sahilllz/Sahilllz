
name: Digital Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  generate-digital-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate Digital Hunter
        env:
          GH_TOKEN: ${{ secrets.TECH_DNA_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests
          import html
          from datetime import datetime

          USERNAME = "Sahilllz"
          OUTPUT = "assets/digital-hunter.svg"

          token = os.environ.get("GH_TOKEN")

          if not token:
              raise RuntimeError(
                  "TECH_DNA_TOKEN secret was not found."
              )

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          response = requests.post(
              "https://api.github.com/graphql",
              json={
                  "query": query,
                  "variables": {
                      "login": USERNAME
                  }
              },
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              },
              timeout=30
          )

          response.raise_for_status()

          data = response.json()

          if "errors" in data:
              raise RuntimeError(
                  "GitHub GraphQL error: "
                  + str(data["errors"])
              )

          calendar = (
              data["data"]["user"]
              ["contributionsCollection"]
              ["contributionCalendar"]
          )

          total = calendar["totalContributions"]

          days = []

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append(day)

          if not days:
              raise RuntimeError(
                  "No GitHub contribution data was returned."
              )

          # -------------------------------------------------
          # Contribution calculations
          # -------------------------------------------------

          maximum = max(
              day["contributionCount"]
              for day in days
          )

          active_days = sum(
              1
              for day in days
              if day["contributionCount"] > 0
          )

          current_streak = 0

          for day in reversed(days):
              if day["contributionCount"] > 0:
                  current_streak += 1
              else:
                  break

          longest_streak = 0
          running = 0

          for day in days:
              if day["contributionCount"] > 0:
                  running += 1
                  longest_streak = max(
                      longest_streak,
                      running
                  )
              else:
                  running = 0

          # -------------------------------------------------
          # SVG configuration
          # -------------------------------------------------

          width = 1000
          height = 430

          left = 65
          top = 125

          cell = 11
          gap = 3

          weeks = calendar["weeks"]

          graph_width = len(weeks) * (cell + gap)

          # Keep graph inside the SVG.
          scale = min(
              1,
              (width - 100) / graph_width
          )

          cell *= scale
          gap *= scale

          # -------------------------------------------------
          # Build contribution cells
          # -------------------------------------------------

          cells = []

          for x, week in enumerate(weeks):

              for day in week["contributionDays"]:

                  count = day["contributionCount"]

                  weekday = day.get("weekday", 0)

                  y = top + weekday * (cell + gap)
                  x_pos = left + x * (cell + gap)

                  if maximum == 0:
                      level = 0
                  else:
                      ratio = count / maximum

                      if count == 0:
                          level = 0
                      elif ratio <= 0.25:
                          level = 1
                      elif ratio <= 0.50:
                          level = 2
                      elif ratio <= 0.75:
                          level = 3
                      else:
                          level = 4

                  colors = [
                      "#07111F",
                      "#102A4A",
                      "#164B83",
                      "#247DD8",
                      "#00D9FF"
                  ]

                  color = colors[level]

                  cells.append(
                      f'''
                      <rect
                        x="{x_pos:.2f}"
                        y="{y:.2f}"
                        width="{cell:.2f}"
                        height="{cell:.2f}"
                        rx="2"
                        fill="{color}"
                        data-count="{count}"
                      />
                      '''
                  )

          # -------------------------------------------------
          # Hunter position
          # -------------------------------------------------

          # Place hunter around the most active area.
          strongest = max(
              days,
              key=lambda d: d["contributionCount"]
          )

          hunter_index = days.index(strongest)

          hunter_x = left + (
              hunter_index / max(len(days) - 1, 1)
          ) * (width - 130)

          hunter_y = top + 55

          # -------------------------------------------------
          # SVG
          # -------------------------------------------------

          svg = f'''<?xml version="1.0" encoding="UTF-8"?>

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 {width} {height}"
            width="100%"
          >

            <defs>

              <linearGradient
                id="bg"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%"
              >
                <stop offset="0%" stop-color="#050816"/>
                <stop offset="55%" stop-color="#0B1220"/>
                <stop offset="100%" stop-color="#111827"/>
              </linearGradient>

              <linearGradient
                id="line"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="0%"
              >
                <stop offset="0%" stop-color="#00D9FF"/>
                <stop offset="100%" stop-color="#7B2FF7"/>
              </linearGradient>

              <filter
                id="glow"
                x="-100%"
                y="-100%"
                width="300%"
                height="300%"
              >
                <feGaussianBlur
                  stdDeviation="4"
                  result="blur"
                />

                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

            </defs>

            <!-- Background -->

            <rect
              width="{width}"
              height="{height}"
              rx="22"
              fill="url(#bg)"
            />

            <!-- Border -->

            <rect
              x="3"
              y="3"
              width="{width-6}"
              height="{height-6}"
              rx="20"
              fill="none"
              stroke="url(#line)"
              stroke-width="2"
            />

            <!-- Header -->

            <text
              x="55"
              y="58"
              fill="#FFFFFF"
              font-family="monospace"
              font-size="28"
              font-weight="700"
            >
              DIGITAL HUNTER
            </text>

            <text
              x="55"
              y="84"
              fill="#8CA3C7"
              font-family="monospace"
              font-size="13"
            >
              CONTRIBUTION ACTIVITY • {USERNAME}
            </text>

            <!-- Status -->

            <circle
              cx="860"
              cy="48"
              r="6"
              fill="#00E676"
              filter="url(#glow)"
            />

            <text
              x="875"
              y="53"
              fill="#00E676"
              font-family="monospace"
              font-size="13"
            >
              HUNTING
            </text>

            <!-- Graph title -->

            <text
              x="55"
              y="115"
              fill="#00D9FF"
              font-family="monospace"
              font-size="12"
            >
              CONTRIBUTION MATRIX
            </text>

            <!-- Contribution cells -->

            {''.join(cells)}

            <!-- Hunter trail -->

            <line
              x1="140"
              y1="{hunter_y}"
              x2="{hunter_x:.2f}"
              y2="{hunter_y}"
              stroke="#7B2FF7"
              stroke-width="2"
              stroke-dasharray="5 8"
              opacity="0.7"
            />

            <!-- Digital Hunter -->

            <g
              transform="translate({hunter_x:.2f},{hunter_y:.2f})"
              filter="url(#glow)"
            >

              <polygon
                points="-18,0 0,-13 18,0 0,13"
                fill="#7B2FF7"
              />

              <circle
                cx="0"
                cy="0"
                r="5"
                fill="#00D9FF"
              />

              <line
                x1="-25"
                y1="0"
                x2="-40"
                y2="0"
                stroke="#00D9FF"
                stroke-width="2"
              />

              <line
                x1="25"
                y1="0"
                x2="40"
                y2="0"
                stroke="#00D9FF"
                stroke-width="2"
              />

            </g>

            <!-- Statistics -->

            <line
              x1="55"
              y1="310"
              x2="945"
              y2="310"
              stroke="#24324A"
            />

            <text
              x="55"
              y="345"
              fill="#7086A8"
              font-family="monospace"
              font-size="11"
            >
              TOTAL CONTRIBUTIONS
            </text>

            <text
              x="55"
              y="373"
              fill="#00D9FF"
              font-family="monospace"
              font-size="24"
              font-weight="700"
            >
              {total}
            </text>

            <text
              x="285"
              y="345"
              fill="#7086A8"
              font-family="monospace"
              font-size="11"
            >
              ACTIVE DAYS
            </text>

            <text
              x="285"
              y="373"
              fill="#00D9FF"
              font-family="monospace"
              font-size="24"
              font-weight="700"
            >
              {active_days}
            </text>

            <text
              x="515"
              y="345"
              fill="#7086A8"
              font-family="monospace"
              font-size="11"
            >
              CURRENT STREAK
            </text>

            <text
              x="515"
              y="373"
              fill="#7B2FF7"
              font-family="monospace"
              font-size="24"
              font-weight="700"
            >
              {current_streak}
            </text>

            <text
              x="745"
              y="345"
              fill="#7086A8"
              font-family="monospace"
              font-size="11"
            >
              LONGEST STREAK
            </text>

            <text
              x="745"
              y="373"
              fill="#7B2FF7"
              font-family="monospace"
              font-size="24"
              font-weight="700"
            >
              {longest_streak}
            </text>

            <!-- Footer -->

            <text
              x="55"
              y="410"
              fill="#536985"
              font-family="monospace"
              font-size="11"
            >
              REAL GITHUB CONTRIBUTION DATA • AUTO UPDATED
            </text>

            <text
              x="945"
              y="410"
              text-anchor="end"
              fill="#536985"
              font-family="monospace"
              font-size="11"
            >
              {datetime.utcnow().strftime("%Y-%m-%d")}
            </text>

          </svg>
          '''

          os.makedirs(
              os.path.dirname(OUTPUT),
              exist_ok=True
          )

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)

          print("Digital Hunter generated successfully.")
          print(f"Total contributions: {total}")
          print(f"Active days: {active_days}")
          print(f"Current streak: {current_streak}")
          print(f"Longest streak: {longest_streak}")

          PY

      - name: Commit Digital Hunter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/digital-hunter.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update Digital Hunter"
          git push
