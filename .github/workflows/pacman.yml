name: Generate Pac-Man

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  pacman:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Pac-Man Contribution Graph
        uses: pencilrebel/pacman-contribution-graph@main
        with:
          github_user_name: Sahilllz
          output_path: assets/pacman.svg

      - name: Commit Pac-Man
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/pacman.svg

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update Pac-Man"
          git push
